<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valora tu experiencia - Linkfortis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter para un aspecto más premium y legible en móviles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen px-4 py-8">
    
    <div class="bg-white p-6 sm:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] max-w-sm w-full text-center border border-slate-100">
        
        <!-- LOGOTIPO -->
        <img src="https://linkfortis.com/encuesta/img/logo_linkfortis.jpeg" alt="Logo Linkfortis" class="h-20 mx-auto mb-6 object-contain rounded-xl">
        
        <!-- TEXTO INTRODUCTORIO -->
        <h2 class="text-2xl font-extrabold text-slate-800 mb-2 tracking-tight">¿Cómo fue tu experiencia?</h2>
        <p class="text-slate-500 mb-8 text-[15px] font-medium">Tu opinión nos ayuda a mejorar:</p>

        <!-- CONTENEDOR DE BOTONES -->
        <div class="flex flex-col gap-5">
            
            <!-- BOTÓN 1: GOOGLE DIRECTO -->
            <a href="https://g.page/r/CX5J64x3a4JfEBI/review" 
               class="relative flex flex-col items-center justify-center w-full py-5 px-4 bg-white border-2 border-blue-50 rounded-2xl shadow-[0_8px_20px_rgba(66,133,244,0.12)] hover:border-blue-100 hover:shadow-[0_8px_25px_rgba(66,133,244,0.2)] active:scale-[0.98] transition-all duration-200 overflow-hidden group">
                
                <!-- Detalle superior de color corporativo sutil -->
                <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-[#4285F4] via-[#EA4335] to-[#FBBC05] opacity-40"></div>

                <!-- Texto con colores institucionales -->
                <span class="font-extrabold text-slate-800 text-[19px] mb-2 tracking-tight">
                    Déjanos una reseña en 
                    <span class="text-[#4285F4]">G</span><span class="text-[#EA4335]">o</span><span class="text-[#FBBC05]">o</span><span class="text-[#4285F4]">g</span><span class="text-[#34A853]">l</span><span class="text-[#EA4335]">e</span>
                </span>
                
                <!-- 5 Estrellas amarillas (más juntas y proporcionadas) -->
                <div class="flex text-[#FBBC05] text-3xl gap-1 drop-shadow-sm">
                    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                </div>
            </a>

            <!-- SEPARADOR VISUAL Y TEXTO RESALTADO -->
            <div class="mt-3 mb-1">
                <hr class="border-slate-100 mb-4">
                <p class="text-slate-900 text-[11px] sm:text-xs uppercase font-extrabold tracking-widest leading-relaxed">
                    Si tu experiencia no fue perfecta,<br>contáctanos:
                </p>
            </div>

            <!-- BOTÓN 2: FEEDBACK / GERENCIA -->
            <a href="https://linkfortis.com/encuesta/feedback/fb_linkfortis.html" 
               class="flex items-center justify-center w-full py-4 px-4 bg-slate-900 hover:bg-black text-white rounded-2xl shadow-md active:scale-[0.98] transition-all duration-200 font-semibold text-[15px]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 opacity-90" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zM7 8H5v2h2V8zm2 0h2v2H9V8zm6 0h-2v2h2V8z" clip-rule="evenodd" />
                </svg>
                Contacta con el gerente / Buzón
            </a>
            
        </div>
    </div>

</body>
</html>
